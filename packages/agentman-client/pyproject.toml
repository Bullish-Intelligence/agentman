[project]
name = "agentman-client"
# Keep this version equal to the root `agentman` version and to
# `agentman.__version__`. A test checks it. See docs/development.md.
version = "0.0.4"
description = "The client, protocol models, and spec loader for the agentman daemon. It has no server dependencies."
readme = "README.md"
requires-python = ">=3.13"

authors = [
  { name = "Bullish-Intelligence", email = "242310653+Bullish-Intelligence@users.noreply.github.com" },
]

dependencies = [
  "pydantic>=2",
  # No extras. `structured_agents` needs only `AgentSpec`.
  "pydantic-ai-slim>=2.41,<3",
  "httpx>=0.28",
  "pyyaml",
]

[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentman", "src/structured_agents"]
